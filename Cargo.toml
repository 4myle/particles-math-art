[package]
description = "Particles Math Art"
name = "particles-math-art"
authors = ["Roger Salomonsson <medicorab@gmail.com>"]
version = "1.0.0"
edition = "2021"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["glow", "persistence"] }
serde  = { version = "1.0.229" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["console"] }

[profile.dev]
debug = 2
opt-level = 0

[profile.dev.package."*"]
debug = 1
opt-level = 3

[profile.release]
debug = 0
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
